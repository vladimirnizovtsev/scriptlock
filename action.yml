# Composite GitHub Action for Scriptlock.
# Installs Node and scriptlock, installs Chromium with the CLI's bundled playwright-core,
# runs `scriptlock diff`, writes the
# markdown report to the job summary and the text report to the log, uploads .scriptlock/
# as a run artifact (unless `artifact: "false"`) and exits with Scriptlock's own exit code
# (0 clean, 1 findings, 2 run error).
# Known limitations: a Linux runner with apt is assumed for `--with-deps`; the scan runs
# once and both reports are rendered from that single snapshot; on a public repository the
# uploaded artifact is downloadable by anyone and GitHub clamps its retention to 90 days.
name: Scriptlock
description: Script inventory and change detection for web pages. Runs scriptlock diff and publishes the report.
author: Vladimir Nizovtsev

branding:
  icon: lock
  color: gray-dark

inputs:
  profile:
    description: Profile name from scriptlock.config.yaml.
    required: false
    default: default
  mode:
    description: Diff mode, gate or drift. gate is for deploy pipelines, drift for the scheduled run.
    required: false
    default: gate
  config:
    description: Path to scriptlock.config.yaml, relative to working-directory. Empty means the default lookup.
    required: false
    default: ""
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: "22"
  version:
    description: scriptlock version to install from npm.
    required: false
    default: latest
  history:
    description: Also write the snapshot and diff under .scriptlock/history/<profile>/ (true or false).
    required: false
    default: "false"
  working-directory:
    description: Directory containing scriptlock.config.yaml and the manifest.
    required: false
    default: "."
  artifact:
    description: >-
      Upload .scriptlock/ as a run artifact (true or false). The snapshot lists every script URL
      on the scanned page, including query strings, plus the final URL and the full
      content-security-policy. On a public repository a run artifact is downloadable by anyone,
      so set this to false when the scanned page must not be described publicly.
    required: false
    default: "true"
  retention-days:
    description: >-
      Retention of the uploaded artifact in days. GitHub clamps this to the repository maximum
      (90 days on public repositories and the Free plan) and only warns, so a longer evidence
      trail needs `history: true` with the files committed, or an archive outside Actions.
    required: false
    default: "90"

outputs:
  exit-code:
    description: Exit code of scriptlock diff. 0 clean, 1 findings at fail severity, 2 run error (blocked, navigation failure, invalid configuration).
    value: ${{ steps.diff-md.outputs.exit-code }}
  summary-file:
    description: Absolute path of the markdown report written by scriptlock diff --format md.
    value: ${{ steps.diff-md.outputs.summary-file }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install scriptlock
      shell: bash
      env:
        SCRIPTLOCK_VERSION: ${{ inputs.version }}
      run: npm install -g "scriptlock@$SCRIPTLOCK_VERSION"

    - name: Install Chromium
      shell: bash
      # Install with the playwright-core bundled inside the just-installed scriptlock,
      # so the browser revision is exactly the one the CLI looks for.
      run: node "$(npm root -g)/scriptlock/node_modules/playwright-core/cli.js" install --with-deps chromium

    - name: Validate inputs
      shell: bash
      env:
        SCRIPTLOCK_MODE: ${{ inputs.mode }}
        SCRIPTLOCK_HISTORY: ${{ inputs.history }}
        SCRIPTLOCK_ARTIFACT: ${{ inputs.artifact }}
      run: |
        case "$SCRIPTLOCK_MODE" in
          gate|drift) ;;
          *) echo "error: mode must be gate or drift, got '$SCRIPTLOCK_MODE'" >&2; exit 2 ;;
        esac
        case "$SCRIPTLOCK_HISTORY" in
          true|false) ;;
          *) echo "error: history must be true or false, got '$SCRIPTLOCK_HISTORY'" >&2; exit 2 ;;
        esac
        case "$SCRIPTLOCK_ARTIFACT" in
          true|false) ;;
          *) echo "error: artifact must be true or false, got '$SCRIPTLOCK_ARTIFACT'" >&2; exit 2 ;;
        esac

    - name: Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTLOCK_PROFILE: ${{ inputs.profile }}
        SCRIPTLOCK_CONFIG: ${{ inputs.config }}
      run: |
        mkdir -p .scriptlock
        args=(scan --profile "$SCRIPTLOCK_PROFILE" --out ".scriptlock/last.$SCRIPTLOCK_PROFILE.json")
        if [ -n "$SCRIPTLOCK_CONFIG" ]; then args+=(--config "$SCRIPTLOCK_CONFIG"); fi
        scriptlock "${args[@]}"

    - name: Diff (markdown to job summary)
      id: diff-md
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTLOCK_PROFILE: ${{ inputs.profile }}
        SCRIPTLOCK_CONFIG: ${{ inputs.config }}
        SCRIPTLOCK_MODE: ${{ inputs.mode }}
      run: |
        summary="$PWD/.scriptlock/diff.$SCRIPTLOCK_PROFILE.md"
        args=(diff --profile "$SCRIPTLOCK_PROFILE" "--$SCRIPTLOCK_MODE" --snapshot ".scriptlock/last.$SCRIPTLOCK_PROFILE.json" --format md --out "$summary")
        if [ -n "$SCRIPTLOCK_CONFIG" ]; then args+=(--config "$SCRIPTLOCK_CONFIG"); fi
        set +e
        scriptlock "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "summary-file=$summary" >> "$GITHUB_OUTPUT"
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "scriptlock diff exited with code $code before writing a report." >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        fi

    - name: Diff (text to log)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTLOCK_PROFILE: ${{ inputs.profile }}
        SCRIPTLOCK_CONFIG: ${{ inputs.config }}
        SCRIPTLOCK_MODE: ${{ inputs.mode }}
        SCRIPTLOCK_HISTORY: ${{ inputs.history }}
      run: |
        args=(diff --profile "$SCRIPTLOCK_PROFILE" "--$SCRIPTLOCK_MODE" --snapshot ".scriptlock/last.$SCRIPTLOCK_PROFILE.json" --format text)
        if [ -n "$SCRIPTLOCK_CONFIG" ]; then args+=(--config "$SCRIPTLOCK_CONFIG"); fi
        if [ "$SCRIPTLOCK_HISTORY" = "true" ]; then args+=(--history); fi
        # The exit code of this command is the exit code of the action. It is not swallowed.
        scriptlock "${args[@]}"

    - name: Upload .scriptlock as a run artifact
      if: always() && inputs.artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: scriptlock-${{ inputs.profile }}-${{ github.job }}
        path: ${{ inputs.working-directory }}/.scriptlock
        # .scriptlock starts with a dot, and upload-artifact has skipped hidden
        # files by default since v4.4. Without this the evidence trail this
        # action exists to produce is silently never uploaded.
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
