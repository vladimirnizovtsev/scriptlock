# Composite GitHub Action for Tessera.
# Installs Node and tessera-cli, installs Chromium with the CLI's bundled playwright-core,
# runs `tessera diff`, writes the
# markdown report to the job summary and the text report to the log, uploads .tessera/
# as a run artifact and exits with Tessera's own exit code (0 clean, 1 findings, 2 run error).
# Known limitations: a Linux runner with apt is assumed for `--with-deps`; the scan runs
# once and both reports are rendered from that single snapshot.
name: Tessera
description: Script inventory and change detection for web pages. Runs tessera diff and publishes the report.
author: Vladimir Nizovtsev

branding:
  icon: lock
  color: gray-dark

inputs:
  profile:
    description: Profile name from tessera.config.yaml.
    required: false
    default: default
  mode:
    description: Diff mode, gate or drift. gate is for deploy pipelines, drift for the scheduled run.
    required: false
    default: gate
  config:
    description: Path to tessera.config.yaml, relative to working-directory. Empty means the default lookup.
    required: false
    default: ""
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: "20"
  version:
    description: tessera-cli version to install from npm.
    required: false
    default: latest
  history:
    description: Also write the snapshot and diff under .tessera/history/<profile>/ (true or false).
    required: false
    default: "false"
  working-directory:
    description: Directory containing tessera.config.yaml and the manifest.
    required: false
    default: "."

outputs:
  exit-code:
    description: Exit code of tessera diff. 0 clean, 1 findings at fail severity, 2 run error (blocked, navigation failure, invalid configuration).
    value: ${{ steps.diff-md.outputs.exit-code }}
  summary-file:
    description: Absolute path of the markdown report written by tessera diff --format md.
    value: ${{ steps.diff-md.outputs.summary-file }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install tessera-cli
      shell: bash
      env:
        TESSERA_VERSION: ${{ inputs.version }}
      run: npm install -g "tessera-cli@$TESSERA_VERSION"

    - name: Install Chromium
      shell: bash
      # Install with the playwright-core bundled inside the just-installed tessera-cli,
      # so the browser revision is exactly the one the CLI looks for.
      run: node "$(npm root -g)/tessera-cli/node_modules/playwright-core/cli.js" install --with-deps chromium

    - name: Validate inputs
      shell: bash
      env:
        TESSERA_MODE: ${{ inputs.mode }}
        TESSERA_HISTORY: ${{ inputs.history }}
      run: |
        case "$TESSERA_MODE" in
          gate|drift) ;;
          *) echo "error: mode must be gate or drift, got '$TESSERA_MODE'" >&2; exit 2 ;;
        esac
        case "$TESSERA_HISTORY" in
          true|false) ;;
          *) echo "error: history must be true or false, got '$TESSERA_HISTORY'" >&2; exit 2 ;;
        esac

    - name: Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESSERA_PROFILE: ${{ inputs.profile }}
        TESSERA_CONFIG: ${{ inputs.config }}
      run: |
        mkdir -p .tessera
        args=(scan --profile "$TESSERA_PROFILE" --out ".tessera/last.$TESSERA_PROFILE.json")
        if [ -n "$TESSERA_CONFIG" ]; then args+=(--config "$TESSERA_CONFIG"); fi
        tessera "${args[@]}"

    - name: Diff (markdown to job summary)
      id: diff-md
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESSERA_PROFILE: ${{ inputs.profile }}
        TESSERA_CONFIG: ${{ inputs.config }}
        TESSERA_MODE: ${{ inputs.mode }}
      run: |
        summary="$PWD/.tessera/diff.$TESSERA_PROFILE.md"
        args=(diff --profile "$TESSERA_PROFILE" "--$TESSERA_MODE" --snapshot ".tessera/last.$TESSERA_PROFILE.json" --format md --out "$summary")
        if [ -n "$TESSERA_CONFIG" ]; then args+=(--config "$TESSERA_CONFIG"); fi
        set +e
        tessera "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "summary-file=$summary" >> "$GITHUB_OUTPUT"
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "tessera diff exited with code $code before writing a report." >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        fi

    - name: Diff (text to log)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESSERA_PROFILE: ${{ inputs.profile }}
        TESSERA_CONFIG: ${{ inputs.config }}
        TESSERA_MODE: ${{ inputs.mode }}
        TESSERA_HISTORY: ${{ inputs.history }}
      run: |
        args=(diff --profile "$TESSERA_PROFILE" "--$TESSERA_MODE" --snapshot ".tessera/last.$TESSERA_PROFILE.json" --format text)
        if [ -n "$TESSERA_CONFIG" ]; then args+=(--config "$TESSERA_CONFIG"); fi
        if [ "$TESSERA_HISTORY" = "true" ]; then args+=(--history); fi
        # The exit code of this command is the exit code of the action. It is not swallowed.
        tessera "${args[@]}"

    - name: Upload .tessera as a run artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tessera-${{ inputs.profile }}-${{ github.job }}
        path: ${{ inputs.working-directory }}/.tessera
        if-no-files-found: warn
        retention-days: 400
