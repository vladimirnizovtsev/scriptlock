<script>
  (function () {
    // Dynamically inserted external script (initiator: script).
    var s = document.createElement('script');
    s.src = '/dynamic.js';
    document.head.appendChild(s);
    // eval and new Function.
    eval('window.__fixture.evalRan = 1 + 1;');
    var fn = new Function('a', 'b', 'return a + b;');
    window.__fixture.fnResult = fn(2, 3);
    // blob: script.
    var blob = new Blob(['window.__fixture.blobRan = true;'], { type: 'text/javascript' });
    var b = document.createElement('script');
    b.src = URL.createObjectURL(blob);
    document.head.appendChild(b);
    // Late tag inserted after 1500 ms.
    setTimeout(function () {
      var l = document.createElement('script');
      l.src = '/late.js';
      document.head.appendChild(l);
    }, 1500);
    // Optional dedicated worker.
    if (location.search.indexOf('worker=1') !== -1) {
      window.__fixture.worker = new Worker('/worker.js');
    }
  })();
</script>
