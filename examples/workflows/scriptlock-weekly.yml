# Weekly drift run. Copy to .github/workflows/scriptlock-weekly.yml in your repository.
#
# The scheduled run is the 11.6.1 change-detection mechanism: it re-scans the payment
# page, compares it to the manifest committed in this repository, writes the report to
# the job summary, keeps the snapshot and diff under .scriptlock/history/ and uploads them as
# a run artifact. When the run fails, GitHub emails the person who last edited the cron
# line below (Actions notifications must be enabled for that account).
#
# On a public repository the job summary and the job log are readable with no GitHub
# account, and the artifact by any signed-in user. The report names the scanned URL and
# every script URL on the page. Set `summary: "false"` and `artifact: "false"` on the step
# below when the payment page must not be described publicly.
name: Scriptlock weekly drift

on:
  schedule:
    # weekly cadence for 11.6.1; change only with a documented targeted risk analysis
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: Drift scan (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The artifact is named scriptlock-<profile>-<job id> by default, so a matrix
        # that varies anything other than the profile (environments, URLs) gives two
        # legs the same artifact name and the second upload fails with a conflict.
        # Set `artifact-name` on the step below to include those matrix values.
        profile: [default]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token is otherwise written into .git/config, inside the directory
          # tree this job scans and uploads.
          persist-credentials: false

      # Pin both the action ref and the npm version: a release tag or, better, a full
      # commit SHA for the action, and an exact version for the tool that produces the
      # evidence. "latest" would silently change what ran between two weekly reports.
      - name: Scriptlock
        uses: vladimirnizovtsev/scriptlock@v0.4.0
        env:
          # Referenced by browser.extraHeaders in scriptlock.config.yaml. A missing
          # variable is a configuration error, so define every ${VAR} the config
          # references. Kept on the step, not on the job: at job level the token would
          # also be in the environment of the npm install that precedes the scan.
          SCRIPTLOCK_SCANNER_TOKEN: ${{ secrets.SCRIPTLOCK_SCANNER_TOKEN }}
          # The preview profile in examples/scriptlock.config.yaml interpolates PREVIEW_URL.
          # It is not scanned here, but the config must still load; point it at production.
          PREVIEW_URL: https://shop.example.com/checkout
        with:
          profile: ${{ matrix.profile }}
          mode: drift
          history: "true"
          version: "0.4.0"
          # summary: "false"      # counts and exit code only, no page map in the log
          # artifact-name: "scriptlock-${{ matrix.profile }}-${{ matrix.environment }}"
