# Weekly drift run. Copy to .github/workflows/tessera-weekly.yml in your repository.
#
# The scheduled run is the 11.6.1 change-detection mechanism: it re-scans the payment
# page, compares it to the manifest committed in this repository, writes the report to
# the job summary, keeps the snapshot and diff under .tessera/history/ and uploads them as
# a run artifact. When the run fails, GitHub emails the person who last edited the cron
# line below (Actions notifications must be enabled for that account).
name: Tessera weekly drift

on:
  schedule:
    # weekly cadence for 11.6.1; change only with a documented targeted risk analysis
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: Drift scan (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default]
    env:
      # Referenced by browser.extraHeaders in tessera.config.yaml. A missing variable is a
      # configuration error, so define every ${VAR} the config references.
      TESSERA_SCANNER_TOKEN: ${{ secrets.TESSERA_SCANNER_TOKEN }}
      # The preview profile in examples/tessera.config.yaml interpolates PREVIEW_URL.
      # It is not scanned here, but the config must still load; point it at production.
      PREVIEW_URL: https://shop.example.com/checkout
    steps:
      - uses: actions/checkout@v4

      # Pin to a release tag or, better, a full commit SHA for supply chain hygiene.
      - name: Tessera
        uses: vladimirnizovtsev/tessera@v1
        with:
          profile: ${{ matrix.profile }}
          mode: drift
          history: "true"
          version: latest
